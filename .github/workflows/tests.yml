name: Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate schema files
        run: yarn run test:schema

      - name: Run grammar tests
        run: yarn run test:grammar

      - name: Run debugger parity tests
        run: yarn run test:parity

      - name: Run extension-host tests
        run: xvfb-run -a yarn run test:extension
